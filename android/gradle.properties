org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 注意：systemProp 代理以用户级 ~/.gradle/gradle.properties 为准（Gradle 优先级：用户级 > 项目级）。
# 本机用户级原配置 127.0.0.1:10808 已失效，已修正为 127.0.0.1:7890。若代理端口变化，改用户级文件即可。

# 关闭实验性并行同步以避免 AGP 在 Android Studio Sync 时触发非线程安全的 HashMap 节点类型转换崩溃
# org.gradle.tooling.parallel=true
android.suppressUnsupportedCompileSdk=37

# ===== 依赖下载重试 =====
# GitHub Actions runner 直连 Maven Central 时偶发 "Connection reset"（单个 aar 被中断），
# Gradle 默认的重试次数扛不住这种抖动，一次 reset 就会让整条流水线失败。
# 这两个是 Gradle 官方的内部调优参数：最多重试 6 次、首次退避 1 秒（之后指数增长）。
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000