name: Android Release

on:
  # 打 tag（v*）自动构建正式包并发布 GitHub Release
  push:
    tags: ['v*']
    branches: [main, master]
  # 分支 / PR 只跑质量门禁（见 quality job），不产出签名包
  pull_request:
  # 手动触发：不创建 Release，只产出 APK + update.json 供下载
  workflow_dispatch:
    inputs:
      update_log:
        description: '更新日志（写入 update.json 与 Release 说明）'
        required: false
        default: '例行更新'

permissions:
  contents: write   # 创建 Release / 上传资产

jobs:
  # ---------------- 质量门禁 ----------------
  # 只读、不需要任何签名密钥，因此在分支与 PR 上都能跑。
  # 目的：把 lint 与单元测试变成"合并前必须通过"的检查，避免回归悄悄进主干。
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        working-directory: android
        run: |
          # 依赖下载偶发 "Connection reset"（Maven Central 抖动，v2.1.0 首次构建就栽在
          # io.coil-kt:coil:2.7.0 的 aar 上）：整步重试 3 次，而不是让整条流水线直接挂掉。
          for attempt in 1 2 3; do
            if ./gradlew :app:lintDebug; then exit 0; fi
            echo "::warning::lint 第 ${attempt} 次失败，30 秒后重试"
            sleep 30
          done
          echo "::error::lint 连续 3 次失败"
          exit 1

      - name: Unit tests
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest :lyrics:testDebugUnitTest; then exit 0; fi
            echo "::warning::单测第 ${attempt} 次失败，30 秒后重试"
            sleep 30
          done
          echo "::error::单测连续 3 次失败"
          exit 1

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  build:
    # 仅在打 tag 或手动触发时产出签名包；普通分支 push / PR 不进入此 job
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥：由 Secret 现场还原（ANDROID_KEYSTORE_BASE64 = keystore 的 base64）。
      # 仓库内任何文件都不包含 keystore / 口令。
      - name: Restore signing keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/aesthetic.jks
          chmod +x android/gradlew
          # 校验 keystore 可读（密码走环境变量，日志会被 Actions 自动打码）
          keytool -list -keystore android/keystore/aesthetic.jks \
            -storepass "$AESTHETIC_STORE_PASSWORD" -alias aesthetic > /dev/null
          echo 'keystore OK'
        env:
          AESTHETIC_STORE_PASSWORD: ${{ secrets.AESTHETIC_STORE_PASSWORD }}

      - name: Build release APK (signed)
        working-directory: android
        run: |
          # 同 quality：依赖/签名产物下载都可能被网络抖动打断，整步重试 3 次
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease; then exit 0; fi
            echo "::warning::打包第 ${attempt} 次失败，30 秒后重试"
            sleep 30
          done
          echo "::error::打包连续 3 次失败"
          exit 1
        env:
          AESTHETIC_STORE_PASSWORD: ${{ secrets.AESTHETIC_STORE_PASSWORD }}
          AESTHETIC_KEY_PASSWORD: ${{ secrets.AESTHETIC_KEY_PASSWORD }}

      # 版本号唯一来源是 build.gradle.kts（编译进 APK），这里从产物反读，避免两处维护
      - name: Collect metadata
        id: meta
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v 'latest' | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          VERNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          VERCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+")
          echo "verName=$VERNAME" >> "$GITHUB_OUTPUT"
          echo "verCode=$VERCODE" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          # sha256 为首选摘要；md5 保留仅供仍在读旧格式的历史版本回退使用
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # release-proxy 要求固定资产名 latest.apk；另留版本化副本
          cp "$APK" android/app/build/outputs/apk/release/latest.apk
          cp "$APK" "android/app/build/outputs/apk/release/aesthetic_music_v${VERNAME}.apk"

      - name: Generate update.json
        run: |
          set -euo pipefail
          LOG="${{ github.event.inputs.update_log }}"
          if [ -z "$LOG" ] || [ "$LOG" = "例行更新" ]; then
            LOG=$(git log -1 --pretty=%s)
          fi
          jq -n \
            --arg v "${{ steps.meta.outputs.verName }}" \
            --argjson c "${{ steps.meta.outputs.verCode }}" \
            --argjson s "${{ steps.meta.outputs.size }}" \
            --arg sha "${{ steps.meta.outputs.sha256 }}" \
            --arg m "${{ steps.meta.outputs.md5 }}" \
            --arg t "$(date '+%Y-%m-%d %H:%M')" \
            --arg l "$LOG" \
            '{versionName:$v, versionCode:$c,
              apkUrl:"https://music.dovislab.com/latest.apk",
              apkSize:$s, sha256:$sha, md5:$m, forceUpdate:false,
              publishTime:$t, updateLog:$l}' > update.json
          cat update.json

      # tag 触发：发布 GitHub Release（资产名必须含 latest.apk / update.json，
      # Vercel release-proxy 按这两个名字转发给 App 更新通道）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Melos v${{ steps.meta.outputs.verName }}
          body: |
            版本 ${{ steps.meta.outputs.verName }}（code ${{ steps.meta.outputs.verCode }}）
            SHA-256: ${{ steps.meta.outputs.sha256 }}
            MD5（历史字段，兼容旧版本）: ${{ steps.meta.outputs.md5 }}
            更新日志：
            ${{ github.event.inputs.update_log != '' && github.event.inputs.update_log || '见提交记录' }}
          files: |
            android/app/build/outputs/apk/release/latest.apk
            android/app/build/outputs/apk/release/aesthetic_music_v${{ steps.meta.outputs.verName }}.apk
            update.json

      # 自动通知 Melos 后端拉取最新 Release 并更新服务器本地 APK（服务器自动清理旧版仅保留最新版）
      - name: Notify Melos Backend to Sync Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SERVER_URL: ${{ secrets.MELOS_SERVER_URL }}
          RELEASE_TOKEN: ${{ secrets.MELOS_RELEASE_TOKEN }}
        run: |
          if [ -n "$SERVER_URL" ] && [ -n "$RELEASE_TOKEN" ]; then
            echo "Notifying backend to sync latest release..."
            curl -s -f -X POST "${SERVER_URL}/api/admin/versions/sync-github" \
              -H "X-Release-Token: ${RELEASE_TOKEN}" \
              -d "tag=${{ github.ref_name }}" || echo "Auto-sync notification sent"
          else
            echo "MELOS_SERVER_URL or MELOS_RELEASE_TOKEN not set, skipping auto-sync notification."
          fi


      # 手动触发：只上传构建产物（不创建 Release）
      - name: Upload artifacts (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            android/app/build/outputs/apk/release/aesthetic_music_v${{ steps.meta.outputs.verName }}.apk
            android/app/build/outputs/apk/release/latest.apk
            update.json