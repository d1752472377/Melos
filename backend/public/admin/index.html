<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/admin/">
  <title>Melos 私有管理中枢</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <!-- 登录视图 -->
  <div id="loginView" class="login-wrap">
    <form class="login-card" id="loginForm" action="javascript:void(0);" onsubmit="return false;">
      <h1>🎵 Melos 管理中枢</h1>
      <p class="sub">音源脚本管理 · 健康测活 · 数据云同步</p>
      <label>用户名</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="admin" required>
      <label>密码</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••" required>
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn primary">登录</button>
    </form>
  </div>

  <!-- 主视图 -->
  <div id="mainView" class="main" hidden>
    <header class="topbar">
      <div class="title">
        <h1>🎵 Melos 私有管理中枢</h1>
        <span class="badge live" id="healthBadge">加载中…</span>
      </div>
      <div class="actions">
        <button class="btn ghost" id="logoutBtn">退出</button>
      </div>
    </header>

    <!-- 导航标签 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabScriptsBtn">📜 音源脚本管理 (推荐)</button>
      <button class="tab-btn" id="tabSourcesBtn">⚙️ 传统后端音源</button>
    </div>

    <!-- 脚本管理视图 -->
    <div id="scriptsView" class="tab-content">
      <div class="sync-info-box">
        <div class="sync-info-title">📱 手机客户端同步连接提示</div>
        <div class="sync-info-desc">
          在 Melos Android 客户端的「设置」或「我的」页面中填入当前服务器地址，即可一键同步下方已激活的健康音源脚本及歌单数据：
        </div>
        <div class="sync-info-fields">
          <div><b>服务端地址：</b><code id="serverAddressDisplay">获取中...</code></div>
          <div><b>数据拉取接口：</b><code>/api/sync/pull</code></div>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="addScriptBtn">＋ 导入 / 添加音源脚本</button>
        <span class="hint">可直接粘贴 .js 代码或输入订阅链接；内置执行器可对直链进行真实测活</span>
      </div>

      <div id="scriptsList" class="sources"></div>
    </div>

    <!-- 传统源视图 -->
    <div id="sourcesView" class="tab-content" hidden>
      <div class="toolbar">
        <button class="btn primary" id="addBtn">＋ 添加传统音源</button>
        <button class="btn ghost" id="reloadBtn">⟳ 重载注册表</button>
        <span class="hint">传统音源运行在 Node 端（易受风控影响，推荐改用音源脚本）</span>
      </div>
      <div id="sourcesList" class="sources"></div>
    </div>
  </div>

  <!-- 添加/编辑脚本模态框 -->
  <div id="scriptModal" class="modal-mask" hidden>
    <div class="modal large-modal">
      <div class="modal-head">
        <h2 id="scriptModalTitle">导入音源脚本</h2>
        <button class="close" id="scriptModalClose">✕</button>
      </div>
      <div class="modal-body">
        <label>脚本名称（可选，留空将自动从代码注释提取）</label>
        <input type="text" id="sf_name" placeholder="例如：六音音源 v1.2.1">

        <label>订阅/下载 URL（输入 URL 可一键抓取；或直接在下方粘贴代码）</label>
        <div style="display: flex; gap: 8px;">
          <input type="url" id="sf_url" placeholder="https://raw.githubusercontent.com/.../latest.js" style="flex:1;">
          <button type="button" class="btn" id="sf_fetchBtn">抓取代码</button>
        </div>

        <label>脚本 JS 代码 (完整文件内容)</label>
        <textarea id="sf_content" rows="12" placeholder="/*! @name ... */ (function() { ... })();" style="width: 100%; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid var(--border); border-radius: 6px;"></textarea>

        <div style="display: flex; gap: 16px; margin-top: 12px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="sf_isActive" checked> 设为当前激活生效源（客户端优先同步此版本）
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="sf_autoCheck" checked> 保存后立即执行健康测活
          </label>
        </div>
      </div>
      <div class="modal-foot">
        <div class="error" id="scriptModalError"></div>
        <button class="btn" id="scriptModalCancel">取消</button>
        <button class="btn primary" id="scriptModalSave">保存并入库</button>
      </div>
    </div>
  </div>

  <!-- 传统音源模态框 -->
  <div id="modal" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">添加传统音源</h2>
        <button class="close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <label>音源 ID（唯一，如 kuwo）</label>
        <input type="text" id="f_id" placeholder="kuwo" autocomplete="off">

        <label>显示名称</label>
        <input type="text" id="f_name" placeholder="酷我">

        <label>类型</label>
        <select id="f_type">
          <option value="kuwo">kuwo（酷我·妖狐 API）</option>
          <option value="netease">netease（网易云·meting）</option>
        </select>

        <label>权重（越大越优先，搜索排序/降级顺序）</label>
        <input type="number" id="f_weight" value="100">

        <div id="configFields"></div>
      </div>
      <div class="modal-foot">
        <div class="error" id="modalError"></div>
        <button class="btn" id="modalCancel">取消</button>
        <button class="btn primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
